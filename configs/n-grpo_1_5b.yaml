defaults:
  - ../src/verl/verl/trainer/config/ppo_trainer@
  - _self_

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False
  latent_rollout:
    enable: true
    answer_start: "</think>"
    force_decode_interval: 512
    force_decode_burn_in: 0
    mix_top_k: 2
    mix_temperature: 0.7
    mix_rate: 0.1
    mix_entropy_threshold: null
    mix_strategy: neighbor
    neighbor_metric: cosine
    disable_mix_on_eval: true

data:
  train_files: data/verl_data/DeepScaleR-Preview-Dataset/train.parquet
  val_files:
    - data/verl_data/aime24/test.parquet
  train_batch_size: 64
  val_batch_size: 16
  max_prompt_length: 4096
  max_response_length: 8192
  filter_overlong_prompts: True
  truncation: 'error'
  reward_fn_key: 'reward_data_source'

actor_rollout_ref:
  model:
    path: models/DeepSeek-R1-Distill-Qwen-1.5B
    use_remove_padding: True
    enable_gradient_checkpointing: True

  actor:
    optim:
      lr: 5e-7
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 2
    ppo_epochs: 1
    use_kl_loss: True
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    entropy_top_ratio: 1
    fsdp_config:
      param_offload: False
      optimizer_offload: True

  rollout:
    name: sglang
    mode: sync
    n: 4
    log_prob_micro_batch_size_per_gpu: 1
    latent_rollout_enable: true

    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    enforce_eager: True
    free_cache_engine: True
    engine_kwargs:
      sglang:
        attention_backend: flashinfer       # 可按硬件改为 fa3/triton/flashmla
    val_kwargs:
      n: 32
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: -1

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: False
      optimizer_offload: True

trainer:
  critic_warmup: 0
  logger: ["console", "tensorboard"]
  project_name: 'n-grpo'
  experiment_name: 'n-grpo'
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 10
  test_freq: 1
  total_epochs: 1
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1
  val_before_train: true

  best_ckpt:
    enable: true
    mode: max
    top_k: 1
