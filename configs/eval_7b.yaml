defaults:
  - ../src/verl/verl/trainer/config/ppo_trainer@
  - _self_

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  latent_rollout:
    enable: false

data:
  train_files: data/verl_data/DeepScaleR-Preview-Dataset/train.parquet
  val_files:
    - data/verl_data/math_500/test.parquet
  train_batch_size: 64
  val_batch_size: 16
  max_prompt_length: 4096
  max_response_length: 8192
  filter_overlong_prompts: false
  truncation: 'error'
  reward_fn_key: 'reward_data_source'

actor_rollout_ref:
  model:
    path: models/DeepSeek-R1-Distill-Qwen-7B
    use_remove_padding: true
    enable_gradient_checkpointing: true

  actor:
    optim:
      lr: 1e-6
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 2
    ppo_epochs: 1
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    fsdp_config:
      param_offload: false
      optimizer_offload: true

  rollout:
    name: sglang
    mode: sync
    n: 4
    log_prob_micro_batch_size_per_gpu: 1
    latent_rollout_enable: false
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    enforce_eager: true
    free_cache_engine: true
    engine_kwargs:
      sglang:
        attention_backend: flashinfer
    val_kwargs:
      n: 32
      do_sample: true
      temperature: 0.6
      top_p: 0.95
      top_k: -1

  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: false
      optimizer_offload: true

trainer:
  val_only: true
  critic_warmup: 0
  logger: ["console", "tensorboard"]
  project_name: 'eval'
  experiment_name: 'eval_7b'
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 10
  test_freq: 1
  total_epochs: 1
  validation_data_dir: outputs/eval/math500
  max_actor_ckpt_to_keep: 1
  max_critic_ckpt_to_keep: 1
  val_before_train: true

  best_ckpt:
    enable: true
    mode: max
    top_k: 1
